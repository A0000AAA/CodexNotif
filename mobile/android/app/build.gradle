plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeystorePath = System.getenv("CODEXNOTIF_ANDROID_KEYSTORE")
def releaseStorePassword = System.getenv("CODEXNOTIF_ANDROID_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("CODEXNOTIF_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("CODEXNOTIF_ANDROID_KEY_PASSWORD")
def releaseSigningConfigured = [
    releaseKeystorePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.trim().isEmpty() }
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    taskName -> taskName.toLowerCase().contains("release")
}

if (releaseTaskRequested && !releaseSigningConfigured) {
    throw new GradleException(
        "Release signing is not configured. Set all CODEXNOTIF_ANDROID_* signing environment variables."
    )
}

android {
    namespace = "org.codexnotif.mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId = "org.codexnotif.mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = "v${flutter.versionName}"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
